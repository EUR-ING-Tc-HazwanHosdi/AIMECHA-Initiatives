<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ✅ SEO META TAGS — ADDED, NO VISUAL CHANGE -->
    <title>{% block title %}AIMeCHA Initiatives | AI-Powered Engineering Solutions{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}AIMeCHA Initiatives provides custom web development, automation, and digital solutions for businesses across Sabah and Malaysia.{% endblock %}">
    <meta name="author" content="AIMeCHA Initiatives">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="{{ request.url }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{% block og_title %}AIMeCHA Initiatives{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Modern websites, smart automation, and reliable tech solutions built for your business.{% endblock %}">
    <meta property="og:url" content="https://aimecha-initiatives.onrender.com">

    <!-- ✅ YOUR ORIGINAL STYLE REMAINS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- ✅ YOUR EXISTING PARTICLES & LAYOUT — NO CHANGES -->
    <div id="particles"></div>
    <div class="bg-grid"></div>

    <!-- Navigation -->
    <nav>
        <a href="/"><img src="{{ url_for('static', filename='logo.png') }}" alt="AIMeCHA Logo" class="logo"></a>
        <ul class="nav-links">
            <li><a href="/" {% if request.endpoint=='home' %}class="active"{% endif %}>Home</a></li>
            <li><a href="/about" {% if request.endpoint=='about' %}class="active"{% endif %}>About</a></li>
            <li><a href="/services" {% if request.endpoint=='services' %}class="active"{% endif %}>Services</a></li>
            <li><a href="/contact" {% if request.endpoint=='contact' %}class="active"{% endif %}>Contact</a></li>
        </ul>
    </nav>

    <!-- Page Content -->
    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer>
        <p>© 2026 AIMeCHA Initiatives — AI-Powered Engineering Solutions | Kota Kinabalu, Sabah</p>
    </footer>

    <!-- ✅ YOUR ORIGINAL PARTICLES.JS SCRIPT — NO CHANGES -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script>
        particlesJS('particles', {
            particles: {
                number: { value: 50, density: { enable: true, value_area: 800 } },
                color: { value: '#00B4D8' },
                shape: { type: 'circle' },
                opacity: { value: 0.4, random: true },
                size: { value: 2.5, random: true },
                line_linked: { enable: true, distance: 140, color: '#28C76F', opacity: 0.15, width: 1 },
                move: { enable: true, speed: 1.2, direction: 'none', random: false, straight: false, out_mode: 'out' }
            }
        });
    </script>
</body>
</html>
