<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Messages</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body { background: #0A1A2F; color: #E0EFFF; padding: 2rem; }
        .container { max-width: 900px; margin: 0 auto; }
        .message-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid #00B4D8;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            backdrop-filter: blur(8px);
        }
        .message-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 0.8rem;
            margin-bottom: 0.8rem;
        }
        .time { color: #28C76F; font-size: 0.9rem; }
        h2 { color: #00B4D8; text-align: center; margin-bottom: 2rem; }
        .top-links {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2rem;
        }
        .back-btn, .logout-btn {
            color: #28C76F;
            text-decoration: none;
            font-weight: 500;
        }
        .logout-btn { color: #FF6B6B; }
        .back-btn:hover, .logout-btn:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-links">
            <a href="/" class="back-btn">← Back to Website</a>
            <a href="/admin/logout" class="logout-btn">🔓 Logout</a>
        </div>

        <h2>📩 All Received Messages</h2>

        {% if messages %}
            {% for msg in messages %}
            <div class="message-card">
                <div class="message-header">
                    <strong>{{ msg.name }}</strong>
                    <span class="time">{{ msg.created_at.strftime('%d %b %Y — %H:%M') }}</span>
                </div>
                <p><strong>Email:</strong> {{ msg.email }}</p>
                <p><strong>Message:</strong><br>{{ msg.message }}</p>
            </div>
            {% endfor %}
        {% else %}
            <p style="text-align:center; color:#888;">No messages yet.</p>
        {% endif %}
    </div>
</body>
</html>
